worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The unprivileged image runs as a non-root user with a read-only root
  # filesystem, so every path nginx writes to must live under /tmp (backed by
  # an emptyDir / tmpfs mount). Miss one of these and nginx fails to start with
  # a permission error that does not obviously point at the cause.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;          # don't advertise the nginx version

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    # 8080, not 80: binding below 1024 requires CAP_NET_BIND_SERVICE, and the
    # container drops all capabilities.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- security headers ---------------------------------------------------
    # The CSP allows connections to the API origin and media from S3. Both are
    # substituted at container start from environment variables, because they
    # differ per environment and a CSP baked at build time would force an image
    # rebuild to change an endpoint.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: ${MEDIA_SRC}; connect-src 'self' ${API_ORIGIN} ${MEDIA_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed assets are immutable - cache them hard.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    # The SPA entry point must never be cached, or users keep running an old
    # bundle after a deploy while the hashed assets it references are gone.
    location = /index.html {
      add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Liveness/readiness target that does not depend on the filesystem.
    location = /healthz {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # Client-side routing: unknown paths serve the SPA shell.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
