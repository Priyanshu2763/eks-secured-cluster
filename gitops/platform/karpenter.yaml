apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter/karpenter
    targetRevision: "1.14.0"
    helm:
      values: |
        settings:
          clusterName: yayyy-cluster
          clusterEndpoint: <fill in after terraform apply>
          interruptionQueue: <fill in after terraform apply>
        serviceAccount:
          name: karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
